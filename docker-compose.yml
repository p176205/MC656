services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mc656
      POSTGRES_USER: ${DB_USERNAME:-mc656_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mc656_dev}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mc656"]
      interval: 5s
      retries: 10

volumes:
  db-data:
