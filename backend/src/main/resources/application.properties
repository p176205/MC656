spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/mc656
spring.datasource.username=mc656_user
spring.datasource.password=mc656_dev

# O Hibernate vai olhar para suas classes @Entity e criar/atualizar as tabelas correspondentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do cookie/session
# Tempo máximo de inatividade da sessão
server.servlet.session.timeout=7d
# Validade do cookie no navegador
server.servlet.session.cookie.max-age=7d